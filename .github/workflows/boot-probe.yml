name: boot-probe
# Boots the game on Windows (Direct3D through ANGLE) and records timings and errors.
on:
  workflow_dispatch:
  push:
    branches: [boot-probe]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install chromium firefox
      - name: shader compile time, Chromium Direct3D 11
        run: node scripts/compile-bench.mjs --name chromium-d3d11 --args "--use-gl=angle --use-angle=d3d11 --ignore-gpu-blocklist --enable-gpu"
        continue-on-error: true
      - name: shader compile time, Firefox
        run: node scripts/compile-bench.mjs --browser firefox --name firefox
        continue-on-error: true
      - name: shader compile time, Chromium software GL (no Direct3D)
        run: node scripts/compile-bench.mjs --name chromium-swiftshader --args "--use-gl=angle --use-angle=swiftshader --enable-unsafe-swiftshader"
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: probe-out }
