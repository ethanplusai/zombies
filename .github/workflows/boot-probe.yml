name: boot-probe
# Boots the game on Windows (Direct3D through ANGLE) and records timings and errors.
on:
  workflow_dispatch:
  push:
    branches: [boot-probe]
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install chromium firefox
      - name: fixed build, Chromium Direct3D 11
        shell: bash
        run: node scripts/boot-probe.mjs "file:///$(pwd -W)/probe-build/index.html" --name fixed-chromium-d3d11 --wait 600 --args "--use-gl=angle --use-angle=d3d11 --ignore-gpu-blocklist --enable-gpu --allow-file-access-from-files"
        continue-on-error: true
      - name: fixed build, Firefox
        shell: bash
        run: node scripts/boot-probe.mjs "file:///$(pwd -W)/probe-build/index.html" --browser firefox --name fixed-firefox --wait 600
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe-out, path: probe-out }
